<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23D97757' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='10'/><path d='m4.93 4.93 4.24 4.24'/><path d='m14.83 9.17 4.24-4.24'/><path d='m14.83 14.83 4.24 4.24'/><path d='m9.17 14.83-4.24 4.24'/><circle cx='12' cy='12' r='4'/></svg>"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="theme-color" content="#0A0A0A" />
    <title>Spectator — кто сейчас в игре</title>
    <meta
      name="description"
      content="Следит за аккаунтами League of Legends и Apex Legends и сообщает, когда игрок заходит в матч."
    />
    <script>
      // Apply the saved theme and motion level before first paint to avoid a flash
      try {
        var t = localStorage.getItem("lol_tracker_theme");
        if (t === "light" || t === "dark")
          document.documentElement.dataset.theme = t;
      } catch (e) {}
      try {
        var m = localStorage.getItem("lol_tracker_motion");
        if (m !== "full" && m !== "calm" && m !== "off")
          m = matchMedia("(prefers-reduced-motion: reduce)").matches
            ? "calm"
            : "full";
        document.documentElement.dataset.motion = m;
      } catch (e) {
        document.documentElement.dataset.motion = "full";
      }
    </script>
  </head>
  <body class="min-h-screen antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
